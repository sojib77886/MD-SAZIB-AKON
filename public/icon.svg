<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer subtle ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#10b981" stroke-width="6" opacity="0.25" stroke-dasharray="12 12" />

  <!-- Shield / Vault shape -->
  <g filter="url(#shadow)">
    <path d="M256 90 L390 140 V245 C390 325 330 395 256 425 C182 395 122 325 122 245 V140 Z" fill="#1e293b" stroke="url(#emeraldGrad)" stroke-width="10" />
  </g>

  <!-- Bengali Taka Symbol ৳ / Wealth icon styled -->
  <circle cx="256" cy="265" r="95" fill="url(#goldGrad)" opacity="0.95" />
  <circle cx="256" cy="265" r="80" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.5" stroke-dasharray="6 4" />
  
  <text x="256" y="305" font-family="'Hind Siliguri', 'Segoe UI', Arial, sans-serif" font-size="115" font-weight="bold" fill="#0f172a" text-anchor="middle">৳</text>
  
  <!-- Small security lock at top -->
  <rect x="238" y="165" width="36" height="28" rx="6" fill="#10b981" />
  <path d="M244 165 V153 A12 12 0 0 1 268 153 V165" fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round" />
  <circle cx="256" cy="177" r="3" fill="#ffffff" />
</svg>
